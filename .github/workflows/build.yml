# Every push to main that changes the app builds the Windows installer and
# releases it automatically, with no tags to push by hand:
#   - in this repository's Releases, for you;
#   - in the public overlay-releases repository, which the website's
#     download button and the in-app updater use.
# Each build gets its own version: major.minor from package.json, and the
# build number as the patch (1.1.12, 1.1.13 …), so updates always move up.
name: Build and release Windows app

on:
  push:
    branches: [main]
    # The website deploys on Vercel by itself; only app changes build the .exe.
    paths-ignore:
      - 'landing-page/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DISCORD_ID: ${{ secrets.OVERLAY_DISCORD_ID }}
      DISCORD_SECRET: ${{ secrets.OVERLAY_DISCORD_SECRET }}
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Native modules (better-sqlite3) rebuilt for this Electron with
      # electron-builder's own tool, which uses a prebuilt binary when one exists.
      - name: Build native modules for Electron
        run: npx electron-builder install-app-deps

      - name: Type-check
        run: npx tsc

      - name: Build the renderer
        run: npx vite build

      - name: Pick this build's version
        id: version
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="$BASE.$GITHUB_RUN_NUMBER"
          npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Overlay $VERSION"

      # Overlay's own Discord app, if the repository has it as secrets.
      - name: Discord app details
        if: env.DISCORD_ID != ''
        shell: bash
        run: |
          printf '{"clientId":"%s","clientSecret":"%s"}' "$DISCORD_ID" "$DISCORD_SECRET" > electron/discord-app.json

      - name: Package the installer
        shell: bash
        run: npx electron-builder --win nsis --publish never --config.directories.output=release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Keep the installer with this run
        uses: actions/upload-artifact@v4
        with:
          name: Overlay-Setup-${{ steps.version.outputs.version }}
          path: release/Overlay-Setup.exe
          if-no-files-found: error

      - name: Release in this repository
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Overlay ${{ steps.version.outputs.version }}
          body: |
            ${{ github.event.head_commit.message }}
          make_latest: true
          files: |
            release/Overlay-Setup.exe
            release/latest.yml
            release/*.blockmap

      # The public copy that the website and the in-app updater download from.
      # Needs the RELEASES_TOKEN secret (Contents read and write on
      # pradhan-not-found/overlay-releases).
      # A release needs a commit to point at; give an empty repository its first one.
      - name: Prepare the public repository
        if: env.RELEASES_TOKEN != ''
        shell: bash
        run: |
          API=https://api.github.com/repos/pradhan-not-found/overlay-releases
          AUTH="Authorization: Bearer $RELEASES_TOKEN"
          if ! curl -sf -H "$AUTH" "$API/commits?per_page=1" >/dev/null; then
            TEXT=$(printf '# Overlay for Windows\n\nDownloads for Overlay. Get the latest installer from Releases.\n' | base64 -w0)
            curl -sf -X PUT -H "$AUTH" -H "Accept: application/vnd.github+json" "$API/contents/README.md" \
              -d "{\"message\":\"Overlay downloads\",\"content\":\"$TEXT\"}" >/dev/null
            echo "Added a README to the empty repository."
          fi

      - name: Release for everyone
        if: env.RELEASES_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: pradhan-not-found/overlay-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: v${{ steps.version.outputs.version }}
          name: Overlay ${{ steps.version.outputs.version }}
          make_latest: true
          files: |
            release/Overlay-Setup.exe
            release/latest.yml
            release/*.blockmap
